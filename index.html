<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Квиз: Информатика</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Стартовый экран выбора класса -->
    <div id="grade-modal" class="modal active">
        <div class="modal-content grade-select-box">
            <h1 class="glow-title">КИБЕР-КВИЗ</h1>
            <p class="subtitle">Выберите класс для запуска викторины:</p>
            <div class="grade-buttons">
                <button class="btn grade-btn" onclick="startQuiz('6')">6 КЛАСС</button>
                <button class="btn grade-btn" onclick="startQuiz('7')">7 КЛАСС</button>
                <button class="btn grade-btn" onclick="startQuiz('8')">8 КЛАСС</button>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс игры -->
    <div class="container" id="game-container" style="display: none;">
        
        <!-- Верхняя панель управления и счет -->
        <header class="header">
            <div class="header-left">
                <span class="active-grade-badge" id="current-grade-badge">6 класс</span>
                <button class="btn btn-sm btn-secondary" onclick="resetToGradeSelection()">Сменить класс</button>
            </div>

            <div class="score-board">
                <!-- Команда 1 -->
                <div class="team-card" id="team1-card">
                    <div class="team-name">Команда 1</div>
                    <div class="team-score" id="score-team1">0</div>
                    <div class="bonus-controls">
                        <button class="btn-bonus" onclick="addCustomPoints(1, 5)">+5</button>
                        <button class="btn-bonus" onclick="addCustomPoints(1, 10)">+10</button>
                        <button class="btn-bonus penalty" onclick="addCustomPoints(1, -5)">-5</button>
                    </div>
                </div>

                <div class="vs-divider">VS</div>

                <!-- Команда 2 -->
                <div class="team-card" id="team2-card">
                    <div class="team-name">Команда 2</div>
                    <div class="team-score" id="score-team2">0</div>
                    <div class="bonus-controls">
                        <button class="btn-bonus" onclick="addCustomPoints(2, 5)">+5</button>
                        <button class="btn-bonus" onclick="addCustomPoints(2, 10)">+10</button>
                        <button class="btn-bonus penalty" onclick="addCustomPoints(2, -5)">-5</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Игровое поле: Категории и карточки с баллами -->
        <main class="grid-board" id="board"></main>

        <!-- Кнопка завершения игры -->
        <footer class="footer">
            <button class="btn btn-finish" onclick="finishGame()">Завершить игру и подвести итог</button>
        </footer>
    </div>

    <!-- Модальное окно вопроса -->
    <div id="question-modal" class="modal">
        <div class="modal-content question-box">
            <div class="modal-header">
                <span id="modal-category" class="tag-category">Категория</span>
                <span id="modal-points" class="tag-points">100 баллов</span>
            </div>
            
            <div class="question-text" id="modal-question-text">Текст вопроса...</div>

            <!-- Варианты ответов -->
            <div class="options-container" id="modal-options"></div>

            <!-- Блок показа ответа -->
            <div class="answer-reveal" id="answer-reveal" style="display: none;">
                <div class="answer-title">Правильный ответ:</div>
                <div class="answer-text" id="correct-answer-text"></div>
            </div>

            <!-- Кнопки управления и начисления баллов -->
            <div class="modal-actions">
                <button class="btn btn-show" id="btn-show-ans" onclick="revealAnswer()">Показать ответ</button>
                
                <div class="award-buttons" id="award-controls" style="display: none;">
                    <span>Начислить очки:</span>
                    <button class="btn btn-award team1" onclick="awardPoints(1)">Команде 1</button>
                    <button class="btn btn-award team2" onclick="awardPoints(2)">Команде 2</button>
                    <button class="btn btn-close" onclick="closeModal(false)">Никому</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно результатов -->
    <div id="result-modal" class="modal">
        <div class="modal-content result-box">
            <h2 class="glow-title">Итоги битвы</h2>
            <div class="winner-declaration" id="winner-text">Команда 1 побеждает!</div>
            
            <div class="final-scores">
                <div class="final-score-item">
                    <span>Команда 1:</span>
                    <strong id="final-team1">0</strong>
                </div>
                <div class="final-score-item">
                    <span>Команда 2:</span>
                    <strong id="final-team2">0</strong>
                </div>
            </div>

            <button class="btn btn-finish" onclick="resetToGradeSelection()">Новая игра</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
