<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Квиз: Информатика</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Стартовое окно настройки игры -->
    <div id="setup-modal" class="modal active">
        <div class="modal-content setup-box">
            <h1 class="glow-title">КИБЕР-КВИЗ</h1>
            <p class="subtitle">Настройка параметров битвы</p>

            <!-- 1. Выбор класса -->
            <div class="setup-section">
                <label class="setup-label">1. Выберите класс:</label>
                <div class="grade-buttons">
                    <button type="button" class="btn grade-btn active" onclick="selectGrade('6', this)">6 класс</button>
                    <button type="button" class="btn grade-btn" onclick="selectGrade('7', this)">7 класс</button>
                    <button type="button" class="btn grade-btn" onclick="selectGrade('8', this)">8 класс</button>
                </div>
            </div>

            <!-- 2. Выбор количества команд -->
            <div class="setup-section">
                <label class="setup-label">2. Количество команд:</label>
                <div class="team-count-buttons">
                    <button type="button" class="btn count-btn active" onclick="setTeamCount(2, this)">2 команды</button>
                    <button type="button" class="btn count-btn" onclick="setTeamCount(3, this)">3 команды</button>
                    <button type="button" class="btn count-btn" onclick="setTeamCount(4, this)">4 команды</button>
                </div>
            </div>

            <!-- 3. Названия команд -->
            <div class="setup-section">
                <label class="setup-label">3. Названия команд:</label>
                <div class="team-names-inputs" id="team-inputs-container">
                    <!-- Поля генерируются через JS -->
                </div>
            </div>

            <button type="button" class="btn btn-start" onclick="startGame()">ПОЕХАЛИ! 🚀</button>
        </div>
    </div>

    <!-- Основной игровой экран -->
    <div class="container" id="game-container" style="display: none;">
        
        <header class="header">
            <div class="header-left">
                <span class="active-grade-badge" id="current-grade-badge">6 класс</span>
                <button type="button" class="btn btn-sm btn-secondary" onclick="resetToSetup()">⚙️ Новая игра</button>
            </div>

            <!-- Динамическое табло команд -->
            <div class="score-board" id="score-board"></div>
        </header>

        <!-- Сетка вопросов -->
        <main class="grid-board" id="board"></main>

        <footer class="footer">
            <button type="button" class="btn btn-finish" onclick="finishGame()">Завершить игру и подвести итог</button>
        </footer>
    </div>

    <!-- Окно вопроса -->
    <div id="question-modal" class="modal">
        <div class="modal-content question-box">
            <div class="modal-header">
                <span id="modal-category" class="tag-category">Категория</span>
                <span id="modal-points" class="tag-points">100 баллов</span>
            </div>
            
            <div class="question-text" id="modal-question-text">Текст вопроса...</div>

            <div class="options-container" id="modal-options"></div>

            <div class="answer-reveal" id="answer-reveal" style="display: none;">
                <div class="answer-title">Правильный ответ:</div>
                <div class="answer-text" id="correct-answer-text"></div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-show" id="btn-show-ans" onclick="revealAnswer()">Показать ответ</button>
                
                <div class="award-controls" id="award-controls" style="display: none;">
                    <div class="award-label">Кому начислить очки?</div>
                    <div class="award-buttons-list" id="award-buttons-list">
                        <!-- Кнопки команд генерируются в JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Окно финальных результатов -->
    <div id="result-modal" class="modal">
        <div class="modal-content result-box">
            <h2 class="glow-title">Итоги битвы</h2>
            <div class="winner-declaration" id="winner-text"></div>
            
            <div class="final-scores-list" id="final-scores-list"></div>

            <button type="button" class="btn btn-finish" onclick="resetToSetup()">Новая игра</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
