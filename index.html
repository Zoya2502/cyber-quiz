<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Квиз: Логический штурм</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Экран 1: Приветствие -->
    <section id="start-screen" class="screen active">
        <div class="overlay">
            <h1 class="glitch-text">Логический штурм</h1>
            <p>Проверь свои знания и логику</p>
            <button id="btn-start" class="neon-btn">НАЧАТЬ ИГРУ</button>
        </div>
    </section>

    <!-- Экран 2: Настройка команд -->
    <section id="setup-screen" class="screen">
        <h2>Настройка Команд</h2>
        <div class="input-group">
            <label>Количество команд:</label>
            <input type="number" id="team-count" min="1" max="6" value="2">
            <button id="btn-gen-teams">ОК</button>
        </div>
        <div id="teams-inputs-container"></div>
        <button id="btn-save-teams" class="neon-btn hidden">СОХРАНИТЬ И ИГРАТЬ</button>
    </section>

    <!-- Экран 3: Игровое поле -->
    <section id="game-screen" class="screen">
        <div class="game-header">
            <div id="scoreboard"></div>
        </div>
        
        <div id="game-board">
            <!-- Сюда JS сгенерирует таблицу -->
        </div>

        <button id="btn-finish-game" class="neon-btn danger-btn">ЗАВЕРШИТЬ ИГРУ И ПОДВЕСТИ ИТОГ</button>
    </section>

    <!-- Экран 4: Итоги -->
    <section id="summary-screen" class="screen">
        <h1 class="glitch-text">ИТОГИ ИГРЫ</h1>
        
        <div class="winner-box">
            <div class="cup-icon">🏆</div>
            <h3>ПОБЕДИТЕЛИ</h3>
            <h2 id="winner-name">...</h2>
            <div id="winner-score">0 очков</div>
        </div>

        <div class="results-list" id="final-results-table">
            <!-- Список всех команд с местами -->
        </div>

        <button id="btn-restart" class="neon-btn">НА ГЛАВНУЮ</button>
    </section>

    <!-- Модальное окно вопроса -->
    <div id="question-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="question-category-display">Категория</div>
            <div id="question-points-display">POINTS</div>
            
            <div class="content-box">
                <p id="question-text">Текст вопроса...</p>
                <div id="answer-block" class="hidden">
                    <hr>
                    <h3 id="answer-header">Правильный ответ:</h3>
                    <p id="answer-text">Текст ответа...</p>
                    
                    <div id="scoring-controls">
                        <p id="scoring-prompt" style="margin-top: 20px;">Кто ответил верно?</p>
                        <div id="team-buttons-container"></div>
                        <button id="btn-no-score" class="cancel-btn">Никто / Пропустить</button>
                    </div>
                </div>
            </div>

            <button id="btn-show-answer" class="neon-btn">ПОСМОТРЕТЬ ОТВЕТ / ОЦЕНИТЬ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
