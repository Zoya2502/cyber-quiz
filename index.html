<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Квиз: Информатика</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Стартовое окно настройки игры -->
    <div id="setup-modal" class="modal active">
        <div class="modal-content setup-box">
            <h1 class="glow-title">КИБЕР-КВИЗ</h1>
            <p class="subtitle">Настройка параметров битвы</p>

            <!-- 1. Выбор класса -->
            <div class="setup-section">
                <label class="setup-label">1. Выберите класс:</label>
                <div class="grade-buttons" id="grade-buttons-group">
                    <button type="button" class="btn grade-btn active" data-grade="6">6 класс</button>
                    <button type="button" class="btn grade-btn" data-grade="7">7 класс</button>
                    <button type="button" class="btn grade-btn" data-grade="8">8 класс</button>
                </div>
            </div>

            <!-- 2. Выбор количества команд -->
            <div class="setup-section">
                <label class="setup-label">2. Количество команд:</label>
                <div class="team-count-buttons" id="team-count-group">
                    <button type="button" class="btn count-btn active" data-count="2">2 команды</button>
                    <button type="button" class="btn count-btn" data-count="3">3 команды</button>
                    <button type="button" class="btn count-btn" data-count="4">4 команды</button>
                </div>
            </div>

            <!-- 3. Названия команд -->
            <div class="setup-section">
                <label class="setup-label">3. Названия команд:</label>
                <div class="team-names-inputs" id="team-inputs-container"></div>
            </div>

            <button type="button" class="btn btn-start" id="btn-start-game">ПОЕХАЛИ! 🚀</button>
        </div>
    </div>

    <!-- Основной игровой экран -->
    <div class="container" id="game-container" style="display: none;">
        <header class="header">
            <div class="header-left">
                <span class="active-grade-badge" id="current-grade-badge">6 класс</span>
                <button type="button" class="btn btn-sm btn-secondary" id="btn-reset-setup">⚙️ Новая игра</button>
            </div>
            <div class="score-board" id="score-board"></div>
        </header>

        <!-- Сетка вопросов -->
        <main class="grid-board" id="board"></main>

        <footer class="footer">
            <button type="button" class="btn btn-finish" id="btn-finish-game">Завершить игру и подвести итог</button>
        </footer>
    </div>

    <!-- Окно вопроса -->
    <div id="question-modal" class="modal">
        <div class="modal-content question-box">
            <div class="modal-header">
                <span id="modal-category" class="tag-category">Категория</span>
                <span id="modal-points" class="tag-points">100 баллов</span>
            </div>
            
            <div class="question-text" id="modal-question-text">Текст вопроса...</div>
            <div class="options-container" id="modal-options"></div>

            <div class="answer-reveal" id="answer-reveal" style="display: none;">
                <div class="answer-title">Правильный ответ:</div>
                <div class="answer-text" id="correct-answer-text"></div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-show" id="btn-show-ans">Показать ответ</button>
                
                <div class="award-controls" id="award-controls" style="display: none;">
                    <div class="award-label">Кому начислить очки?</div>
                    <div class="award-buttons-list" id="award-buttons-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Окно итогов -->
    <div id="result-modal" class="modal">
        <div class="modal-content result-box">
            <h2 class="glow-title">Итоги битвы</h2>
            <div class="winner-declaration" id="winner-text"></div>
            <div class="final-scores-list" id="final-scores-list"></div>
            <button type="button" class="btn btn-finish" id="btn-restart-game">Новая игра</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
